# Complete ai-skills.yaml example.
# Labels in comments:
#   REQUIRED - the field must be present in this context.
#   OPTIONAL - the field may be omitted; the comment states its default.

sources: # OPTIONAL; defaults to an empty list.
  - path: ./local-skills # REQUIRED for every source; relative to this file.
    type: local # OPTIONAL; local is the default. Other supported value: github.
    subpath: # OPTIONAL; local defaults to the source folder itself.
      - skills/go
    exclude_from_checks: # OPTIONAL; adds to settings.validation.exclude_from_checks.
      - fixtures
    # tags is not supported yet: validation reports unsupported-tags.

  - path: https://github.com/example/ai-skills.git # REQUIRED; Git URL for github.
    type: github # Set it for GitHub URLs; local is the default.
    tree: main # OPTIONAL; Git branch or tag, defaults to master.
    subpath: # OPTIONAL; GitHub sources default to [skills].
      - skills/common-workflow
      - skills/go

target: # OPTIONAL; a string path, or the named-target mapping below. Default: .agents/skills.
  for_each: # OPTIONAL; adapters added to every named target.
    adapters: [] # OPTIONAL; string or list.

  default: # OPTIONAL named target.
    path: .agents/skills # OPTIONAL for the target named default.

  claude: # OPTIONAL named target.
    path: .claude/skills # OPTIONAL for the target named claude.
    adapters: # OPTIONAL; added to for_each.adapters.
      - claude-property-adapter # Renames frontmatter whenToUse to when_to_use for Claude Code.

  review: # OPTIONAL custom named target.
    path: .review/skills # REQUIRED for names other than default and claude.

settings: # OPTIONAL; every child has a default.
  # OPTIONAL string path; base folder for downloaded GitHub sources.
  # A relative path is resolved from this ai-skills.yaml file.
  # The folder must already exist and be writable.
  # Omit it or use an empty string to use the operating system temp folder.
  temp_dir: ./.tmp/ai-skill-manager

  dry_run: false # OPTIONAL; default false. Plan and print without writing.
  remove_orphans: true # OPTIONAL; default true. Delete managed folders whose skill is gone.
  add_relations: true # OPTIONAL; default false. Also load skills that selected skills link to.

  validation: # OPTIONAL.
    # OPTIONAL; default [examples, templates]. Top-level skill folders copied but not checked.
    # Use [] to check every folder.
    exclude_from_checks:
      - examples
      - templates
